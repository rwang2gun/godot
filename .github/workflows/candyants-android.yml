name: CandyAnts Android Debug APK

# 일회성/수동 안드로이드 디버그 APK 빌드.
# 이 클라우드 세션 컨테이너에서는 dl.google.com(Android SDK)이 막혀 직접 빌드가
# 불가능하므로, GitHub Actions 러너를 원격 빌드 머신으로 사용한다.
# 결과물은 run 페이지의 "candyants-debug-apk" artifact 로 내려받는다.

on:
  push:
    branches: [ "claude/candyants-itch-deployment-Vdyf9" ]
    paths:
      - "CandyAnts/**"
      - ".github/workflows/candyants-android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: CandyAnts
  PACKAGE_NAME: "org.rwang2gun.candyants"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools & platform
        run: |
          yes | sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Resolve latest Godot 4.6 stable tag
        id: godot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/godotengine/godot-builds/tags?per_page=100" \
            | python3 -c "import sys,json,re; ts=[t['name'] for t in json.load(sys.stdin)]; ts=[t for t in ts if re.match(r'^4\.6(\.[0-9]+)?-stable\$', t)]; ts.sort(key=lambda s:[int(x) for x in s.replace('-stable','').split('.')]); print(ts[-1] if ts else '')")
          if [ -z "$tag" ]; then tag="4.6-stable"; fi
          ver_dir=$(echo "$tag" | sed 's/-stable/.stable/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver_dir=$ver_dir" >> "$GITHUB_OUTPUT"
          echo "Resolved Godot: tag=$tag  template_dir=$ver_dir"

      - name: Download Godot editor + export templates
        env:
          TAG: ${{ steps.godot.outputs.tag }}
          VER_DIR: ${{ steps.godot.outputs.ver_dir }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/$TAG"
          curl -fL -o godot.zip "$base/Godot_v${TAG}_linux.x86_64.zip"
          curl -fL -o templates.tpz "$base/Godot_v${TAG}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${TAG}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/$VER_DIR"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/$VER_DIR/"
          /usr/local/bin/godot --version || true

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Write Godot editor settings (Android SDK + debug keystore)
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "--- editor settings ---"; cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Generate Android export preset
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/candyants.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="${PACKAGE_NAME}"
          package/name="CandyAnts"
          package/signed=true
          package/app_category=2
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/internet=false
          EOF
          echo "--- export_presets.cfg ---"; cat export_presets.cfg

      - name: Import resources (headless)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --import . 2>&1 | tail -50 || true

      - name: Export debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --export-debug "Android" build/candyants.apk 2>&1 | tee export.log
          echo "---- build dir ----"
          ls -la build
          test -f build/candyants.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: candyants-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/candyants.apk
          if-no-files-found: error
