<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420">
  <rect width="1240" height="420" fill="#050505"/>
  <style>
    .body { fill: #e9e9e9; stroke: #050505; stroke-width: 4; }
    .left { fill: #ff1717; stroke: #050505; stroke-width: 4; }
    .right { fill: #16a7d8; stroke: #050505; stroke-width: 4; }
    .joint { fill: #050505; }
    .label { fill: #e9e9e9; font: 700 22px Arial, sans-serif; text-anchor: middle; }
    .note { fill: #bfc7cc; font: 600 14px Arial, sans-serif; text-anchor: middle; }
  </style>

  <defs>
    <g id="torso">
      <circle class="body" cx="64" cy="48" r="40"/>
      <path class="body" d="M80 38 L98 20 L102 34 Z"/>
      <rect class="body" x="34" y="106" width="70" height="84" rx="14"/>
      <rect class="body" x="34" y="206" width="72" height="58" rx="14"/>
      <line x1="58" y1="88" x2="58" y2="108" stroke="#e9e9e9" stroke-width="10"/>
      <line x1="60" y1="190" x2="60" y2="206" stroke="#e9e9e9" stroke-width="10"/>
    </g>
  </defs>

  <!-- Pose 1: left arm high, right arm low; right leg folded, left leg driving down -->
  <g transform="translate(12 12)">
    <use href="#torso"/>
    <ellipse class="left" cx="102" cy="72" rx="20" ry="56" transform="rotate(22 102 72)"/>
    <ellipse class="left" cx="80" cy="118" rx="17" ry="45" transform="rotate(35 80 118)"/>
    <ellipse class="right" cx="118" cy="126" rx="20" ry="48" transform="rotate(7 118 126)"/>
    <ellipse class="right" cx="92" cy="142" rx="18" ry="56" transform="rotate(112 92 142)"/>

    <ellipse class="right" cx="74" cy="250" rx="21" ry="62" transform="rotate(74 74 250)"/>
    <ellipse class="right" cx="117" cy="283" rx="22" ry="64" transform="rotate(12 117 283)"/>
    <ellipse class="left" cx="62" cy="292" rx="21" ry="60" transform="rotate(-22 62 292)"/>
    <ellipse class="left" cx="88" cy="353" rx="21" ry="60" transform="rotate(-28 88 353)"/>

    <text class="label" x="74" y="398">1</text>
    <text class="note" x="74" y="416">left arm high</text>
  </g>

  <!-- Pose 2: crossing, both arms near top, legs swapping -->
  <g transform="translate(325 12)">
    <use href="#torso"/>
    <ellipse class="right" cx="103" cy="70" rx="20" ry="56" transform="rotate(-22 103 70)"/>
    <ellipse class="right" cx="92" cy="118" rx="18" ry="48" transform="rotate(70 92 118)"/>
    <ellipse class="left" cx="128" cy="82" rx="18" ry="50" transform="rotate(14 128 82)"/>
    <ellipse class="left" cx="112" cy="123" rx="16" ry="49" transform="rotate(64 112 123)"/>

    <ellipse class="right" cx="74" cy="250" rx="21" ry="58" transform="rotate(110 74 250)"/>
    <ellipse class="right" cx="126" cy="296" rx="22" ry="64" transform="rotate(-6 126 296)"/>
    <ellipse class="left" cx="58" cy="278" rx="20" ry="58" transform="rotate(-38 58 278)"/>
    <ellipse class="left" cx="82" cy="336" rx="20" ry="58" transform="rotate(32 82 336)"/>

    <text class="label" x="74" y="398">2</text>
    <text class="note" x="74" y="416">cross</text>
  </g>

  <!-- Pose 3: right arm high, left arm low; left leg folded, right leg driving down -->
  <g transform="translate(660 12)">
    <use href="#torso"/>
    <ellipse class="right" cx="102" cy="72" rx="20" ry="56" transform="rotate(22 102 72)"/>
    <ellipse class="right" cx="80" cy="118" rx="17" ry="45" transform="rotate(35 80 118)"/>
    <ellipse class="left" cx="126" cy="126" rx="20" ry="48" transform="rotate(7 126 126)"/>
    <ellipse class="left" cx="96" cy="140" rx="18" ry="56" transform="rotate(112 96 140)"/>

    <ellipse class="left" cx="112" cy="252" rx="21" ry="62" transform="rotate(74 112 252)"/>
    <ellipse class="left" cx="129" cy="288" rx="22" ry="64" transform="rotate(10 129 288)"/>
    <ellipse class="right" cx="64" cy="292" rx="21" ry="60" transform="rotate(-22 64 292)"/>
    <ellipse class="right" cx="91" cy="353" rx="21" ry="60" transform="rotate(-28 91 353)"/>

    <text class="label" x="74" y="398">3</text>
    <text class="note" x="74" y="416">right arm high</text>
  </g>

  <!-- Pose 4: crossing back, mirror of pose 2 rhythm -->
  <g transform="translate(980 12)">
    <use href="#torso"/>
    <ellipse class="left" cx="103" cy="70" rx="20" ry="56" transform="rotate(-22 103 70)"/>
    <ellipse class="left" cx="92" cy="118" rx="18" ry="48" transform="rotate(70 92 118)"/>
    <ellipse class="right" cx="128" cy="82" rx="18" ry="50" transform="rotate(14 128 82)"/>
    <ellipse class="right" cx="112" cy="123" rx="16" ry="49" transform="rotate(64 112 123)"/>

    <ellipse class="left" cx="74" cy="250" rx="21" ry="58" transform="rotate(110 74 250)"/>
    <ellipse class="left" cx="126" cy="296" rx="22" ry="64" transform="rotate(-6 126 296)"/>
    <ellipse class="right" cx="58" cy="278" rx="20" ry="58" transform="rotate(-38 58 278)"/>
    <ellipse class="right" cx="82" cy="336" rx="20" ry="58" transform="rotate(32 82 336)"/>

    <text class="label" x="74" y="398">4</text>
    <text class="note" x="74" y="416">cross back</text>
  </g>

  <g transform="translate(480 18)">
    <ellipse class="left" cx="0" cy="0" rx="28" ry="10"/>
    <text class="note" x="92" y="5">left limbs</text>
    <ellipse class="right" cx="190" cy="0" rx="28" ry="10"/>
    <text class="note" x="285" y="5">right limbs</text>
  </g>
</svg>
